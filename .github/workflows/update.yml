on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # Every hour

name: Take leaderboard snapshot
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take leaderboard snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd pkg/data
          npm ci
          npm run take-snapshot
